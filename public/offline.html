<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — DevisRapide</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1e3d;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
        opacity: 0.85;
      }
      button {
        background: #f1d23a;
        color: #0f1e3d;
        border: 0;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        background: #f7dd4f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="DevisRapide" class="logo" />
      <h1>Vous êtes hors ligne</h1>
      <p>
        Reconnectez-vous à internet pour accéder à votre espace artisan,
        recevoir vos leads et gérer votre wallet.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </div>
  </body>
</html>
